<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b3859"/>
      <stop offset="100%" stop-color="#041628"/>
    </radialGradient>
    
    <!-- Outer Glow & Tech Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Monogram DP Gradient -->
    <linearGradient id="dpGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="dpGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Tech Orbit Circles -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.7"/>
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="8 6 16 6" opacity="0.8"/>
  
  <!-- Outer Orbit Nodes -->
  <circle cx="250" cy="14" r="7" fill="#10b981"/>
  <circle cx="474" cy="250" r="5" fill="#06b6d4"/>
  <circle cx="250" cy="486" r="7" fill="#3b82f6"/>
  <circle cx="26" cy="250" r="5" fill="#10b981"/>
  <circle cx="85" cy="85" r="4" fill="#06b6d4"/>
  <circle cx="415" cy="85" r="4" fill="#10b981"/>
  <circle cx="415" cy="415" r="4" fill="#3b82f6"/>
  <circle cx="85" cy="415" r="4" fill="#10b981"/>

  <!-- Tech Arrows on Ring -->
  <path d="M 280 20 L 290 25 L 280 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 290 20 L 300 25 L 290 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 300 20 L 310 25 L 300 30" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Main Thick Tech Ring Frame -->
  <circle cx="250" cy="250" r="212" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner Navy Canvas -->
  <circle cx="250" cy="250" r="198" fill="#061e36"/>

  <!-- Bottom Curved White Banner for Text -->
  <path d="M 58 270 A 198 198 0 0 0 442 270 L 442 300 A 198 198 0 0 1 58 300 Z" fill="#ffffff"/>
  <path d="M 52 270 C 110 288 390 288 448 270 A 198 198 0 0 1 52 270 Z" fill="#ffffff"/>
  <rect x="52" y="270" width="396" height="150" fill="#ffffff" clip-path="url(#innerClip)"/>

  <!-- Clip path for inner circle white area -->
  <clipPath id="innerClip">
    <circle cx="250" cy="250" r="198"/>
  </clipPath>

  <!-- Re-apply white background via clip path for clean curve -->
  <g clip-path="url(#innerClip)">
    <path d="M 30 270 L 470 270 L 470 460 L 30 460 Z" fill="#ffffff"/>
    <line x1="50" y1="270" x2="450" y2="270" stroke="#06b6d4" stroke-width="3"/>
  </g>

  <!-- Speed Lines & Monogram DP Graphic (Top Section) -->
  <g transform="translate(0, -10)">
    <!-- Speed streaks on the left -->
    <rect x="95" y="185" width="28" height="6" rx="3" fill="#10b981"/>
    <rect x="110" y="198" width="35" height="6" rx="3" fill="#22d3ee"/>
    <rect x="132" y="211" width="25" height="6" rx="3" fill="#10b981"/>
    <rect x="116" y="224" width="32" height="6" rx="3" fill="#34d399"/>

    <!-- DP Monogram Path -->
    <!-- D Loop & Backstem -->
    <path d="M 155 130 L 260 130 C 310 130 335 155 335 195 C 335 235 305 260 255 260 L 180 260 C 165 260 155 250 155 235 Z" fill="none" stroke="url(#dpGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inner P Loop -->
    <path d="M 275 130 L 325 130 C 365 130 385 150 385 185 C 385 220 360 240 320 240 L 275 240 Z" fill="none" stroke="url(#dpGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Dollar Sign ($) inside D -->
    <g transform="translate(218, 172)">
      <text x="0" y="32" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="38" fill="#10b981" text-anchor="middle">$</text>
    </g>
  </g>

  <!-- Text Section on Bottom White Arc -->
  <g text-anchor="middle">
    <!-- "DIGITAL PRO" Title -->
    <text x="242" y="335" font-family="'Inter', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#092540" letter-spacing="2">DIGITAL PRO</text>
    <!-- Green Dot over O -->
    <circle cx="398" cy="312" r="6" fill="#10b981"/>

    <!-- Subtitle: INVOICE SERVICES & SOLUTIONS -->
    <text x="250" y="365" font-family="'Inter', 'Roboto', sans-serif" font-weight="800" font-size="16" fill="#475569" letter-spacing="3.5">INVOICE SERVICES &amp; SOLUTIONS</text>
  </g>

  <!-- Bottom Frame Arc Accent -->
  <path d="M 120 435 A 198 198 0 0 0 380 435" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round"/>
</svg>
